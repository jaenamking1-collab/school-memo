<meta charset="utf-8" />
<title>메모</title>
<!-- 메모 파일은 HTML 이다. 파일에 코드가 심겨 있어도 실행되지 않게 인라인 스크립트·이벤트 핸들러·외부 주소를 막는다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src file: data:; base-uri 'none'; form-action 'none'" />
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* 아래 display:flex 규칙에 눌리지 않게 */
  html, body { height: 100%; }
  :root { --bg: #fdf07a; }
  body {
    margin: 0;
    background: var(--bg);
    font: 13px/1.6 "Malgun Gothic", "맑은 고딕", sans-serif;
    color: #3a3320;
    overflow: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
  }

  #hd { display: flex; align-items: center; gap: 1px; padding: 3px 3px 2px 0; flex: none; cursor: default; background: rgba(90, 70, 0, .14); } /* 끌기는 index.js 가 맡는다. drag 영역은 더블클릭을 받지 못한다 */

  #title {
    flex: 0 1 auto;
    min-width: 34px;
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    outline: 0;
    padding: 3px 6px 3px 10px;
    border-radius: 3px;
  }
  #title[contenteditable='true'] { background: rgba(255, 255, 255, .7); user-select: text; cursor: text; }
  #title:empty::before { content: attr(data-auto); opacity: .45; } /* 제목을 안 적으면 본문 첫 글을 보여준다 */
  #sp { flex: 1; align-self: stretch; } /* 창을 끄는 빈 자리 */
  #hd button {
    width: 22px; height: 21px;
    border: 0; background: transparent; border-radius: 4px;
    font-size: 12px; line-height: 1; cursor: pointer; color: #554c22;
  }
  #hd button:hover { background: rgba(0, 0, 0, .1); }
  #hd button.on { background: rgba(0, 0, 0, .17); }

  /* 크기 조절 테두리. 끌면 크기가 바뀌고 더블클릭하면 내용에 맞춘다 */
  .rz { position: fixed; z-index: 20; }
  #rz-l, #rz-r { top: 26px; bottom: 7px; width: 6px; cursor: ew-resize; }
  #rz-l, #rz-bl { left: 0; }
  #rz-r, #rz-br { right: 0; }
  #rz-b { left: 7px; right: 7px; bottom: 0; height: 6px; cursor: ns-resize; }
  #rz-bl, #rz-br { bottom: 0; width: 7px; height: 7px; }
  #rz-bl { cursor: nesw-resize; }
  #rz-br { cursor: nwse-resize; }

  /* 서식 줄: 쓰는 중일 때만 나온다 */
  #fmt { display: none; flex: none; gap: 1px; padding: 1px 6px 3px; }
  body.active #fmt { display: flex; }
  #fmt button { width: 25px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; font: 12px/1 "Malgun Gothic", sans-serif; color: #554c22; cursor: pointer; }
  #fmt button:hover { background: rgba(0, 0, 0, .1); }

  /* 체크리스트 */
  .chk { min-height: 1.6em; }
  .box {
    display: inline-block; width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px;
    border: 1.5px solid #6b5f2a; border-radius: 3px; cursor: pointer; user-select: none;
    font: 700 11px/10px "Malgun Gothic", sans-serif; text-align: center; color: #fff;
  }
  .done .box { background: #6b5f2a; }
  .done .box::after { content: '✓'; }
  .done { text-decoration: line-through; opacity: .6; }
  #ed ul { margin: 0; padding-left: 20px; }

  /* 색 고르기 */
  #colors {
    position: fixed; top: 25px; right: 4px; z-index: 10;
    display: flex; gap: 5px; padding: 6px;
    background: #fffbe0; border-radius: 7px;
    box-shadow: 0 2px 8px rgba(60, 45, 0, .4);
  }
  #colors button { width: 22px; height: 22px; padding: 0; border: 1px solid rgba(90, 70, 0, .3); border-radius: 5px; cursor: pointer; }
  #colors button:hover { transform: scale(1.12); }
  #colors button.on { box-shadow: 0 0 0 2px #fffbe0, 0 0 0 4px #4c8bf5; }

  #wrap { position: relative; flex: 1; min-height: 0; }

  #ed {
    height: 100%;
    overflow: auto;
    padding: 3px 11px 11px;
    outline: 0;
    user-select: text;
    word-break: break-word;
  }
  /* 세로 스크롤바를 감춘다. 휠·키보드 스크롤은 그대로 된다. */
  #ed { scrollbar-width: none; }
  #ed::-webkit-scrollbar { width: 0; height: 0; }
  #ed:empty::before { content: '여기에 적으면 바로 저장됩니다.'; opacity: .4; }
  #ed a { color: #1552b8; text-decoration: underline; cursor: pointer; word-break: break-all; }
  #ed img { cursor: move; max-width: 100%; vertical-align: bottom; }
  #ed img.sel { outline: 2px solid #4c8bf5; }

  /* 사진 조절 */
  #grip {
    position: absolute; width: 14px; height: 14px;
    background: #4c8bf5; border: 2px solid #fff; border-radius: 3px;
    cursor: nwse-resize; z-index: 5;
  }
  #tools {
    position: absolute; z-index: 5; display: flex; gap: 4px;
    background: #333; padding: 4px; border-radius: 5px;
  }
  #tools button { border: 0; background: #555; color: #fff; font-size: 12px; padding: 3px 7px; border-radius: 3px; cursor: pointer; }
  #tools button:hover { background: #4c8bf5; }
</style>

<div id="hd">
  <div id="title" spellcheck="false" data-auto="제목" title="더블클릭해서 제목 고치기"></div>
  <div id="sp"></div>
  <button id="b-new" title="새 메모">+</button>
  <button id="b-color" title="포스트잇 색 바꾸기">🎨</button>
  <button id="b-hide" title="최소화 (화면 끝 탭에 남습니다)">─</button>
</div>

<div id="colors" hidden></div>

<div id="wrap">
  <div id="ed" contenteditable spellcheck="false"></div>
  <div id="grip" hidden></div>
  <div id="tools" hidden>
    <button data-a="border">테두리</button>
    <button data-a="reset">원래 크기</button>
    <button data-a="del">삭제</button>
  </div>
</div>

<div id="fmt">
  <button data-c="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
  <button data-c="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
  <button data-c="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
  <button data-c="strikeThrough" title="취소선 (Ctrl+T)"><s>S</s></button>
  <button data-c="insertUnorderedList" title="글머리표">•</button>
  <button data-c="check" title="체크리스트">☑</button>
</div>

<div class="rz" id="rz-l" data-e="l"></div>
<div class="rz" id="rz-r" data-e="r"></div>
<div class="rz" id="rz-b" data-e="b"></div>
<div class="rz" id="rz-bl" data-e="lb"></div>
<div class="rz" id="rz-br" data-e="rb"></div>

<script src="index.js"></script>
