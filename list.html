<meta charset="utf-8" />
<title>메모 목록</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  /* 창 가장자리 여백은 그림자 자리다 */
  body { padding: 10px; font: 13px/1.4 "Malgun Gothic", "맑은 고딕", sans-serif; color: #3a3320; }
  #p {
    height: 100%; display: flex; flex-direction: column;
    background: #fffbe0; border-radius: 8px;
    box-shadow: 0 4px 12px rgba(60, 45, 0, .4);
    animation: in-l .16s ease-out;
  }
  body.right #p { animation-name: in-r; }
  @keyframes in-l { from { transform: translateX(30px); opacity: 0; } }
  @keyframes in-r { from { transform: translateX(-30px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #p { animation: none; } }

  #hd { display: flex; align-items: center; gap: 4px; padding: 8px 8px 6px; flex: none; }
  #hd b { flex: 1; font-size: 13px; }
  #hd button, #new { border: 0; border-radius: 5px; background: transparent; font: inherit; cursor: pointer; color: #554c22; }
  #hd button { padding: 2px 7px; font-size: 12px; }
  #hd button:hover, #new:hover { background: rgba(120, 95, 0, .14); }
  #hd button.on { background: #fdf07a; font-weight: 700; }
  #new { margin: 0 8px 6px; padding: 6px; text-align: left; flex: none; }
  #items { flex: 1; overflow: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .item { display: flex; align-items: center; gap: 7px; padding: 6px 8px 6px 11px; cursor: pointer; }
  .item:hover { background: rgba(120, 95, 0, .1); }
  .dot { flex: none; width: 11px; height: 11px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(90, 70, 0, .3); }
  .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.open .nm { font-weight: 700; }
  .item button { flex: none; border: 0; border-radius: 4px; background: transparent; cursor: pointer; font: inherit; font-size: 12px; padding: 1px 4px; opacity: 0; }
  .item:hover button, .item button.ask { opacity: 1; }
  .item button.ask { background: #c62f2f; color: #fff; }
  #none { padding: 14px 12px; color: #6b5f2a; }
</style>
<div id="p">
  <div id="hd">
    <b>메모 목록</b>
    <button data-o="recent">최근순</button>
    <button data-o="name">이름순</button>
  </div>
  <button id="new">+ 새 메모</button>
  <div id="items"></div>
  <div id="none" hidden>저장된 메모가 없습니다.</div>
</div>
<script src="list.js"></script>
